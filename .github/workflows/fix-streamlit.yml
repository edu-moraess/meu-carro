name: Fix Streamlit MVP

on:
  push:
    paths:
      - '.github/workflows/fix-streamlit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/streamlit-mvp

      - name: Fix known Streamlit issues
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'upload = st.file_uploader("Ou envie uma foto de recibo", type=["jpg","jpeg","png","webp"], max_upload_size=10)':
                  'upload = st.file_uploader("Ou envie uma foto de recibo", type=["jpg", "jpeg", "png", "webp"])',
              'next_date = c2.date_input("Próxima data (opcional)", value=None)':
                  'has_next_date = c2.checkbox("Definir próxima data")\n        next_date = c2.date_input("Próxima data", value=date.today(), disabled=not has_next_date)',
              'next_due_date=next_date if next_date else None,':
                  'next_due_date=next_date if has_next_date else None,',
              'url = f"https://generativelanguage.googleapis.com/v1beta/models/{GEMINI_MODEL}:generateContent?key={GEMINI_API_KEY}"':
                  'url = f"https://generativelanguage.googleapis.com/v1beta/models/{GEMINI_MODEL}:generateContent"',
              'response = requests.post(url, json=payload, timeout=25)':
                  'response = requests.post(url, json=payload, headers={"x-goog-api-key": GEMINI_API_KEY}, timeout=25)',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Compile check
        run: python -m py_compile streamlit_app.py

      - name: Commit fixes and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git diff --cached --quiet || git commit -m 'fix: correct Streamlit API usage and Gemini key handling'
          git rm .github/workflows/fix-streamlit.yml
          git commit -m 'chore: remove one-shot repair workflow'
          git push origin HEAD:feat/streamlit-mvp
